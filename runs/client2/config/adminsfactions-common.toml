[economy]
	#Cost to claim one chunk, in copper coins (100 copper = 1 silver).
	# Default: 100
	# Range: > 1
	claimCostCopper = 100
	#Daily upkeep cost per claimed chunk, in copper coins.
	# Default: 20
	# Range: > 0
	upkeepPerClaimPerDay = 20
	#Hours between upkeep charges (default 24 = once per real day).
	# Default: 24
	# Range: 1 ~ 720
	upkeepIntervalHours = 24
	#Maximum chunks a faction may claim (0 = unlimited).
	# Default: 50
	# Range: 0 ~ 10000
	maxClaimsPerFaction = 50

[market]
	#Maximum active listings a player may have at once.
	# Default: 5
	# Range: 1 ~ 100
	maxListingsPerPlayer = 5
	#Tax % deducted from Buy-It-Now sales.
	# Default: 10
	# Range: 0 ~ 100
	marketTaxBinPercent = 10
	#Tax % for 4-hour auctions.
	# Default: 10
	# Range: 0 ~ 100
	marketTaxAuction4h = 10
	#Tax % for 8-hour auctions.
	# Default: 12
	# Range: 0 ~ 100
	marketTaxAuction8h = 12
	#Tax % for 12-hour auctions.
	# Default: 16
	# Range: 0 ~ 100
	marketTaxAuction12h = 16
	#Tax % for 16-hour auctions.
	# Default: 20
	# Range: 0 ~ 100
	marketTaxAuction16h = 20
	#Tax % for 24-hour auctions.
	# Default: 24
	# Range: 0 ~ 100
	marketTaxAuction24h = 24

[war]
	#Duration of the grace period after a war is declared, in seconds (default 600 = 10 minutes). Also changeable in-game via /faction war graceperiod set <seconds>.
	# Default: 600
	# Range: 0 ~ 86400
	gracePeriodSeconds = 600
	#Lives each committed attacker gets per war.
	# Default: 3
	# Range: 1 ~ 20
	attackerLives = 3
	#Lives each defender gets when their faction has active upkeep.
	# Default: 3
	# Range: 1 ~ 20
	defenderLives = 3
	#Lives each defender gets when their faction vault is empty (no upkeep).
	# Default: 1
	# Range: 1 ~ 20
	defenderLivesNoUpkeep = 1
	#Block radius around the defending faction table that counts as the capture point.
	# Default: 25
	# Range: 5 ~ 200
	captureRadiusBlocks = 25
	#Seconds of uncontested attacker presence needed to capture the point and win.
	# Default: 300
	# Range: 30 ~ 3600
	captureTimeSeconds = 300
	#Block radius from the defending faction table that defines the war boundary. Attackers who leave this area lose all their lives.
	# Default: 300
	# Range: 50 ~ 10000
	boundaryRadiusBlocks = 300
	#Whether the war boundary is enforced for attackers.
	boundaryEnabled = true

[vassal]
	#Percentage of a vassal faction's market sale proceeds and claim costs redirected as tax to the suzerain.
	# Default: 15
	# Range: 0 ~ 100
	taxPercent = 15
	#Total copper a vassal faction must pay from their vault to purchase independence (default 500 gold = 5,000,000 copper).
	# Default: 5000000
	# Range: > 1000
	buyoutCopperValue = 5000000
